name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/android
          npm install -g @capacitor/cli

      - name: 🔧 Add Android platform
        run: npx cap add android

      - name: 🔄 Sync Capacitor
        run: npx cap sync android

      - name: 🔐 Add Camera & Storage Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          
          # إضافة أذونات الكاميرا والملفات
          PERMISSIONS='    <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
          '
          
          # إدراج الأذونات قبل وسم </manifest>
          sed -i "s|</manifest>|${PERMISSIONS}</manifest>|" "$MANIFEST"
          
          # عرض النتيجة
          echo "=== AndroidManifest.xml ==="
          cat "$MANIFEST"

      - name: 🎨 Set App Icons and Name
        run: |
          # تغيير اسم التطبيق
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">SIC Enterprise<\/string>/' android/app/src/main/res/values/strings.xml
          
          # تغيير اسم الحزمة في strings
          cat android/app/src/main/res/values/strings.xml

      - name: 🔨 Build Debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SIC-Enterprise-APK-v2
          path: android/app/build/outputs/apk/debug/*.apk
