name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Capacitor
        run: |
          npm install
          npm install @capacitor/core @capacitor/android
          npm install -g @capacitor/cli

      - name: 🔧 Add Android
        run: npx cap add android

      - name: 🔄 Sync
        run: npx cap sync android

      - name: 🔐 Add Camera Permissions
        run: python3 .github/add-permissions.py

      - name: 🎨 Apply SIC Icons and Name
        run: |
          echo "=== Applying SIC Enterprise icons ==="

          # الأيقونات المربعة
          cp www/icon-192.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp www/icon-192.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp www/icon-192.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp www/icon-512.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp www/icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          # الأيقونات الدائرية
          cp www/icon-192.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp www/icon-192.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp www/icon-192.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp www/icon-512.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp www/icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

          # أيقونة داخل التطبيق
          mkdir -p android/app/src/main/res/drawable
          cp www/icon-192.png android/app/src/main/res/drawable/splash.png

          # تغيير اسم التطبيق
          if [ -f android/app/src/main/res/values/strings.xml ]; then
            sed -i 's|<string name="app_name">.*</string>|<string name="app_name">SIC Enterprise</string>|' android/app/src/main/res/values/strings.xml
            sed -i 's|<string name="title_activity_main">.*</string>|<string name="title_activity_main">SIC Enterprise</string>|' android/app/src/main/res/values/strings.xml
          fi

          echo "=== Verify icons ==="
          ls -la android/app/src/main/res/mipmap-hdpi/
          echo "=== Done! ==="

      - name: 🔨 Build APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SIC-Enterprise-APK-v3
          path: android/app/build/outputs/apk/debug/*.apk
